name: Site health monitoring
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send a clearly labeled Telegram test to both recipients
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: site-health-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .monitor-state.json
          key: site-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: site-monitor-
      - name: Check website and notify both Telegram recipients on status changes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          MONITOR_URL: https://blitz-career.vercel.app/api/health
          MONITOR_TEST_NOTIFICATION: ${{ github.event.inputs.test_notification || 'false' }}
        run: node scripts/monitor-site.mjs
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: always()
        with:
          path: .monitor-state.json
          key: site-monitor-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record weekly availability and retain repository activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/record-monitor-status.mjs
